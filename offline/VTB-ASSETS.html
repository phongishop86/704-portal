<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTB-ASSETS | Quản lý Tài sản &amp; CCDC</title>
<style>
:root{
  --primary:#0b5ed7; --primary-dark:#07428f; --primary-light:#e8f1fd;
  --accent:#14b8a6; --bg:#f3f5f9; --card:#ffffff; --border:#e2e6ee;
  --text:#1b2330; --text-mute:#6b7585;
  --green:#1a9c5b; --green-bg:#e6f8ef;
  --red:#d9344a; --red-bg:#fdeaec;
  --gray:#6b7585; --gray-bg:#eef0f4;
  --amber:#c9890c; --amber-bg:#fdf3dc;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c4ccda;border-radius:6px;}

#app{display:flex;min-height:100vh;}

/* Login */
.login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary-dark),var(--primary) 55%,var(--accent));}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:40px 36px;width:380px;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.login-logo .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;}
.login-logo .name{font-size:20px;font-weight:800;color:var(--primary-dark);letter-spacing:.3px;}
.login-sub{color:var(--text-mute);margin:0 0 22px;font-size:13px;}
.login-card label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin:14px 0 5px;}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.15s;}
.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-weight:600;width:100%;margin-top:20px;font-size:14.5px;}
.btn-primary:hover{background:var(--primary-dark);}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-mute);background:var(--bg);padding:10px 12px;border-radius:8px;line-height:1.7;}
.login-error{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-top:14px;}

/* Sidebar */
.sidebar{width:248px;flex:0 0 248px;background:linear-gradient(180deg,#0c2340,#0a1c33 60%);color:#cfd8e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
.sidebar-head .name{color:#fff;font-weight:800;font-size:15.5px;}
.sidebar-head .sub{font-size:10.5px;color:#8fa3c2;letter-spacing:.4px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#6f84a6;margin:16px 10px 6px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cfd8e8;font-size:13.5px;cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;}
.sidebar-foot{padding:12px 16px;font-size:10.5px;color:#5f7497;border-top:1px solid rgba(255,255,255,.08);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5;}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar-title{font-size:16.5px;font-weight:700;}
.breadcrumb{font-size:12px;color:var(--text-mute);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;background:var(--bg);}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.user-chip .nm{font-size:12.5px;font-weight:600;line-height:1.1;}
.user-chip .rl{font-size:10.5px;color:var(--text-mute);}
.btn-logout{border:1px solid var(--border);background:#fff;padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--text);font-weight:600;}
.btn-logout:hover{background:var(--red-bg);color:var(--red);border-color:var(--red);}

.content{padding:22px;flex:1;}
.page-title{font-size:19px;font-weight:800;margin:0 0 4px;}
.page-sub{color:var(--text-mute);font-size:13px;margin:0 0 18px;}

/* Cards / stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;border:1px solid var(--border);transition:.15s;position:relative;overflow:hidden;}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,60,.12);}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-card .lab{font-size:12px;color:var(--text-mute);font-weight:600;}
.stat-card .val{font-size:26px;font-weight:800;margin-top:4px;}
.stat-card.active{outline:2px solid var(--primary);}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:18px;margin-bottom:16px;}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;}
.warn-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:var(--amber-bg);color:#7a5a06;font-size:13px;margin-bottom:6px;cursor:pointer;}
.warn-row:hover{filter:brightness(.97);}
.warn-row.danger{background:var(--red-bg);color:#7a1322;}

/* Toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.toolbar .grow{flex:1;min-width:180px;}
.input,.select{padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;width:100%;}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-blue{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-blue:hover{background:var(--primary-dark);}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* Table */
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:#f8f9fc;font-weight:700;font-size:12px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.3px;user-select:none;cursor:pointer;position:sticky;top:0;}
th.sortable:hover{color:var(--primary);}
th .arrow{margin-left:4px;font-size:10px;}
tbody tr:hover{background:var(--primary-light);}
tbody tr{cursor:pointer;}
.selbanner{display:flex;align-items:center;gap:12px;background:var(--primary);color:#fff;padding:9px 14px;font-size:13px;font-weight:600;border-radius:var(--radius) var(--radius) 0 0;}
.selbanner .sp{flex:1;}
.selbanner button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 11px;border-radius:6px;font-size:12px;font-weight:600;}
.selbanner button:hover{background:rgba(255,255,255,.3);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:var(--gray-bg);color:var(--gray);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-blue{background:var(--primary-light);color:var(--primary);}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--text-mute);}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.form-field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin-bottom:5px;}
.form-actions{display:flex;gap:10px;margin-top:18px;}

/* Steps */
.steps{display:flex;align-items:center;margin:4px 0 20px;flex-wrap:wrap;}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;background:var(--gray-bg);color:var(--text-mute);font-size:12.5px;font-weight:600;margin-right:6px;margin-bottom:6px;}
.step.done{background:var(--green-bg);color:var(--green);}
.step.current{background:var(--primary);color:#fff;}
.step .n{width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:10.5px;}
.step.current .n,.step.done .n{background:rgba(255,255,255,.3);}

.hist-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.hist-item .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:4px;flex:0 0 9px;}
.hist-item .t{color:var(--text-mute);font-size:11.5px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-mute);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--primary);border-color:var(--primary);}

.empty{text-align:center;padding:40px 20px;color:var(--text-mute);}
.flash{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.flash .msg{background:#1b2330;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px;}
.flash .msg.ok{background:var(--green);}
.flash .msg.err{background:var(--red);}

.fab-back{position:fixed;right:24px;bottom:24px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 18px rgba(11,94,215,.45);border:none;z-index:90;}
.fab-back:hover{background:var(--primary-dark);}

.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;z-index:300;}
.modal{background:#fff;border-radius:12px;padding:22px;width:420px;max-width:92vw;max-height:86vh;overflow:auto;}
.modal h3{margin-top:0;}

.quickref{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.quickref button{font-size:12px;}

.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;}
.kv .k{color:var(--text-mute);font-weight:600;}

.filegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.filecard{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fafbfd;}
.filecard.has{border-color:var(--green);background:var(--green-bg);}
.filecard h4{margin:0 0 6px;font-size:13px;}
.filecard .fn{font-size:11.5px;color:var(--text-mute);word-break:break-all;}

@media(max-width:860px){
  .sidebar{position:fixed;left:-260px;z-index:100;transition:.2s;}
  .sidebar.open{left:0;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

];

/* ========================= Utils ========================= */
function uid(prefix){ return (prefix||"ID")+"-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function escapeHtml(s){ s=(s===null||s===undefined)?"":String(s); return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtMoney(n){ n=Number(n||0); return n.toLocaleString("vi-VN")+" đ"; }
function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString("vi-VN"); }
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function stripDiacritics(str){
  str=(str||"").toString();
  str=str.normalize("NFD").replace(/[̀-ͯ]/g,"");
  str=str.replace(/đ/g,"d").replace(/Đ/g,"D");
  return str;
}
function normKey(s){ return stripDiacritics(String(s||"")).toLowerCase().replace(/\s+/g," ").trim(); }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function byId(id){ var l=DB.assets; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function userById(id){ var l=DB.users; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function deptById(id){ var l=DB.departments; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function catById(id){ var l=DB.categories; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function deptName(id){ var d=deptById(id); return d?d.name:"(Không rõ phòng ban)"; }
function catName(id){ var c=catById(id); return c?(c.code?c.code+" - ":"")+c.name:"(Chưa phân nhóm)"; }
function arrayBufferToBase64(buf){
  var bytes=new Uint8Array(buf), binary="", chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){ binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(binary);
}
function base64ToUint8Array(b64){
  var binary=atob(b64), bytes=new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function downloadBlob(blob, filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

    {id:"CCDC-000001", code:"CCDC-000001", name:"Laptop Dell Latitude 5420", type:"CCDC", catId:"C4", deptId:"D1", userId:"U3",

      history:[{status:STATUS.USE, date:"2023-03-15", note:"Ghi nhận ban đầu", by:"admin"}]},

function loadDB(){
  var raw=null;
  try{ raw=localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(!raw){ DB=seedData(); saveDB(); return; }
  try{
    DB=JSON.parse(raw);
    migrateDB();
  }catch(e){
    DB=seedData();
  }
  saveDB();
}
function migrateDB(){
  if(!DB.version) DB.version=1;
  if(!DB.departments) DB.departments=[];
  if(!DB.categories) DB.categories=[];
  if(!DB.users) DB.users=[];
  if(!DB.assets) DB.assets=[];
  if(!DB.transfers) DB.transfers=[];
  if(!DB.repairs) DB.repairs=[];
  if(!DB.inventories) DB.inventories=[];
  if(!DB.templateConfig) DB.templateConfig={files:{}};
  if(!DB.templateConfig.files) DB.templateConfig.files={};
  if(!DB.inventoryCadenceMonths) DB.inventoryCadenceMonths=6;
  DB.assets.forEach(function(a){ if(!a.history) a.history=[]; if(a.nguyenGia===undefined) a.nguyenGia=a.giaTriConLai||0; });
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.warn("saveDB failed", e); }
}
function hardReset(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  DB=seedData();
  saveDB();
  state.session=null;
  state.history=[];
  state.selectedIds={};
}

/* ========================= App state / router ========================= */
var state = {
  route:"login", params:{}, flash:[], session:null,
  history:[], sidebarOpen:false,
  assetFilters:{q:"", type:"", status:"", catId:"", deptId:""},
  sortCol:{assets:"code"}, sortDir:{assets:1},
  selectedIds:{}
};

function currentUser(){ return state.session ? userById(state.session.userId) : null; }
function hasRole(){ var u=currentUser(); if(!u) return false; for(var i=0;i<arguments.length;i++) if(u.role===arguments[i]) return true; return false; }

function nav(route, params, opts){
  opts=opts||{};
  if(!opts.replace && state.route && state.route!=="login"){
    state.history.push({route:state.route, params:state.params});
    if(state.history.length>40) state.history.shift();
  }
  state.route=route; state.params=params||{};
  state.selectedIds={};
  render();
  window.scrollTo(0,0);
}
function goBack(){
  var prev=state.history.pop();
  if(prev){ state.route=prev.route; state.params=prev.params; state.selectedIds={}; render(); }
  else nav("dashboard",{},{replace:true});
}
function flash(msg, type){
  state.flash.push({id:uid("F"), msg:msg, type:type||"ok"});
  render();
  setTimeout(function(){ state.flash.shift(); renderFlashOnly(); }, 3200);
}
function renderFlashOnly(){
  var el=qs("#flashHost"); if(el) el.outerHTML=flashHtml();
}
function flashHtml(){
  return '<div class="flash" id="flashHost">'+state.flash.map(function(f){
    return '<div class="msg '+f.type+'">'+escapeHtml(f.msg)+'</div>';
  }).join("")+'</div>';
}

/* ========================= Render root ========================= */
function render(){
  var root=qs("#app");
  if(!state.session){ root.innerHTML = viewLogin(); bindGlobalEvents(); return; }
  var u=currentUser();
  if(!u){ state.session=null; root.innerHTML=viewLogin(); bindGlobalEvents(); return; }
  var body = renderRoute(u);
  root.innerHTML =
    '<div class="sidebar'+(state.sidebarOpen?' open':'')+'">'+renderSidebar(u)+'</div>'+
    '<div class="main">'+
      '<div class="topbar">'+
        '<div class="topbar-left"><div class="topbar-title">'+pageTitle()+'</div></div>'+
        '<div class="topbar-right">'+
          '<div class="user-chip"><div class="av">'+escapeHtml((u.name||"?").slice(0,1))+'</div>'+
            '<div><div class="nm">'+escapeHtml(u.name)+'</div><div class="rl">'+escapeHtml(ROLE_LABELS[u.role]||u.role)+'</div></div></div>'+
          '<button class="btn-logout" data-action="logout">Đăng xuất</button>'+
        '</div>'+
      '</div>'+
      '<div class="content">'+body+'</div>'+

/* ========================= Dashboard ========================= */
function statusCounts(list){
  var m={}; STATUS_LIST.forEach(function(s){m[s]=0;}); list.forEach(function(a){ m[a.status]=(m[a.status]||0)+1; }); return m;
}
function scopedAssets(u){
  if(hasRole("admin","tcth","it")) return DB.assets.slice();
  if(hasRole("ldp")) return DB.assets.filter(function(a){ return a.deptId===u.deptId; });
  return DB.assets.filter(function(a){ return a.userId===u.id || a.deptId===u.deptId; });
}
function viewDashboard(u){
  var list = scopedAssets(u);
  var counts = statusCounts(list);
  var totalNguyenGia=0, totalConLai=0;
  list.forEach(function(a){ totalNguyenGia+=Number(a.nguyenGia||0); totalConLai+=Number(a.giaTriConLai||0); });
  var orphan = list.filter(function(a){ return !a.userId || !deptById(a.deptId); });

  // inventory overdue check
  var cadence = DB.inventoryCadenceMonths||6;
  var overdue=[];
  DB.departments.forEach(function(d){
    var invs = DB.inventories.filter(function(i){ return i.deptId===d.id || i.scope==="ALL"; });
    var last = invs.length ? invs.map(function(i){return i.date;}).sort().pop() : null;
    var overdueFlag = false;
    if(!last) overdueFlag=true;
    else{
      var months=(new Date()-new Date(last))/(1000*60*60*24*30);
      if(months>cadence) overdueFlag=true;
    }
    if(overdueFlag) overdue.push({dept:d, last:last});
  });

  var pendingTransfers = DB.transfers.filter(function(t){ return t.step<4; }).length;
  var pendingRepairs = DB.repairs.filter(function(r){ return r.step<3; }).length;

  var html = '<p class="page-sub">Xin chào, '+escapeHtml(u.name)+' — tổng hợp nhanh tình trạng tài sản thuộc phạm vi của bạn.</p>';
  html += '<div class="stat-grid">'+
    statCard("Tổng số tài sản", list.length, "var(--primary)", "assets", {}) +
    statCard("Đang sử dụng", counts[STATUS.USE], "var(--green)", "assets", {status:STATUS.USE}) +
    statCard("Hỏng / Đề nghị SC", counts[STATUS.BROKEN], "var(--red)", "assets", {status:STATUS.BROKEN}) +
    statCard("Đề nghị thanh lý", counts[STATUS.LIQ], "var(--gray)", "assets", {status:STATUS.LIQ}) +
    statCard("Tổng nguyên giá", fmtMoney(totalNguyenGia), "var(--primary)", "assets", {}) +
    statCard("Giá trị còn lại", fmtMoney(totalConLai), "var(--accent)", "assets", {}) +
  '</div>';

  html += '<div class="form-grid">';
  html += '<div class="card"><h3>⏰ Cảnh báo kiểm kê định kỳ ('+cadence+' tháng/lần)</h3>';
  if(!overdue.length) html+='<div class="empty">Không có phòng ban nào quá hạn kiểm kê 🎉</div>';
  else overdue.forEach(function(o){
    html+='<div class="warn-row" data-nav="inventory" data-nav-params=\'{"deptId":"'+o.dept.id+'"}\'>'+
      '<span>⚠️</span><span>'+escapeHtml(o.dept.name)+' — '+(o.last?('lần kiểm kê gần nhất: '+fmtDate(o.last)):'chưa từng kiểm kê')+'</span></div>';
  });
  html+='</div>';

  html += '<div class="card"><h3>❓ Tài sản thiếu thông tin ('+orphan.length+')</h3>';
  if(!orphan.length) html+='<div class="empty">Không có tài sản nào thiếu người sử dụng / phòng ban</div>';
  else orphan.slice(0,6).forEach(function(a){
    html+='<div class="warn-row danger" data-nav="asset_detail" data-nav-params=\'{"id":"'+a.id+'"}\'>'+
      '<span>❗</span><span>'+escapeHtml(a.code)+' - '+escapeHtml(a.name)+' '+(!a.userId?'(chưa gán người dùng)':'')+(!deptById(a.deptId)?' (phòng ban không hợp lệ)':'')+'</span></div>';
  });
  if(orphan.length>6) html+='<div class="pill">+'+(orphan.length-6)+' tài sản khác — xem tại Sổ Tài sản</div>';
  html+='</div></div>';

  html += '<div class="form-grid">';
  html += '<div class="card"><h3>🔄 Điều chuyển đang xử lý: '+pendingTransfers+'</h3><div class="quickref">'+
    '<button class="btn btn-sm" data-nav="transfers">Xem danh sách</button>'+
    '<button class="btn btn-sm btn-blue" data-nav="transfer_new">+ Lập lệnh mới</button></div></div>';
  html += '<div class="card"><h3>🛠️ Phiếu sửa chữa đang xử lý: '+pendingRepairs+'</h3><div class="quickref">'+
    '<button class="btn btn-sm" data-nav="repairs">Xem danh sách</button>'+
    '<button class="btn btn-sm btn-blue" data-nav="repair_new">+ Báo hỏng mới</button></div></div>';
  html+='</div>';
  return html;
}
function statCard(label,val,color,route,filters){
  return '<div class="stat-card" data-nav="'+route+'" data-nav-params=\''+JSON.stringify({applyFilters:filters}).replace(/'/g,"&#39;")+'\'>'+
    '<div class="bar" style="background:'+color+'"></div><div class="lab">'+escapeHtml(label)+'</div><div class="val">'+val+'</div></div>';
}

/* ========================= Assets list ========================= */
function viewAssetsList(u){
  if(state.params && state.params.applyFilters){
    state.assetFilters.status = state.params.applyFilters.status || "";
    state.params.applyFilters=null;
  }
  if(state.params && state.params.deptId){ state.assetFilters.deptId = state.params.deptId; }
  if(state.params && state.params.catId){ state.assetFilters.catId = state.params.catId; state.assetFilters.q=""; }

  var f=state.assetFilters;
  var list = scopedAssets(u).filter(function(a){
    if(f.type && a.type!==f.type) return false;
    if(f.status && a.status!==f.status) return false;
    if(f.catId && a.catId!==f.catId) return false;
    if(f.deptId && a.deptId!==f.deptId) return false;
    if(f.q){
      var qn=normKey(f.q);
      if(normKey(a.code).indexOf(qn)<0 && normKey(a.name).indexOf(qn)<0) return false;
    }
    return true;
  });

  var col=state.sortCol.assets||"code", dir=state.sortDir.assets||1;
  list.sort(function(a,b){
    var va,vb;
    if(col==="deptName"){ va=deptName(a.deptId); vb=deptName(b.deptId); }
    else if(col==="nguyenGia"||col==="giaTriConLai"){ va=Number(a[col]||0); vb=Number(b[col]||0); return (va-vb)*dir; }
    else{ va=(a[col]||"").toString(); vb=(b[col]||"").toString(); }
    return va.localeCompare(vb,"vi")*dir;
  });

  var canBulk = hasRole("admin","tcth");
  var selCount = Object.keys(state.selectedIds).filter(function(k){return state.selectedIds[k];}).length;

  var cols=[
    {k:"code", label:"Mã"}, {k:"name", label:"Tên tài sản"}, {k:"type", label:"Loại"},
    {k:"deptName", label:"Phòng ban"}, {k:"nguyenGia", label:"Nguyên giá"}, {k:"giaTriConLai", label:"Giá trị còn lại"},
    {k:"status", label:"Trạng thái"}
  ];

  var html = '<p class="page-sub">Danh sách tài sản cố định &amp; công cụ dụng cụ. Nhấp tiêu đề cột để sắp xếp.</p>';
  html += '<div class="toolbar">'+
    '<div class="grow"><input class="input" id="f_q" placeholder="Tìm theo mã hoặc tên..." value="'+escapeHtml(f.q)+'"></div>'+
    '<select class="select" id="f_type" style="width:140px"><option value="">-- Loại --</option>'+
      '<option value="TSCD"'+(f.type==="TSCD"?' selected':'')+'>TSCĐ</option>'+
      '<option value="CCDC"'+(f.type==="CCDC"?' selected':'')+'>CCDC</option></select>'+
    '<select class="select" id="f_status" style="width:190px"><option value="">-- Trạng thái --</option>'+
      STATUS_LIST.map(function(s){return '<option value="'+s+'"'+(f.status===s?' selected':'')+'>'+s+'</option>';}).join("")+
    '</select>'+
    '<select class="select" id="f_cat" style="width:200px"><option value="">-- Nhóm tài sản --</option>'+
      DB.categories.map(function(c){return '<option value="'+c.id+'"'+(f.catId===c.id?' selected':'')+'>'+escapeHtml((c.code?c.code+" - ":"")+c.name)+'</option>';}).join("")+
    '</select>'+
    '<select class="select" id="f_dept" style="width:220px"><option value="">-- Phòng ban --</option>'+
      DB.departments.map(function(d){return '<option value="'+d.id+'"'+(f.deptId===d.id?' selected':'')+'>'+escapeHtml(d.name)+'</option>';}).join("")+
    '</select>'+
    (hasRole("admin","tcth")?'<button class="btn btn-blue" data-nav="asset_form">+ Thêm tài sản</button>':'')+
    '<button class="btn" data-action="export-assets-csv">⬇ Xuất Excel</button>'+
  '</div>';

  html += '<div class="table-wrap">';
  if(selCount>0 && canBulk){
    html += '<div class="selbanner"><span class="sp">✅ Đã chọn '+selCount+' thiết bị</span>'+
      '<button data-action="bulk-status" data-status="'+STATUS.LIQ+'">Chuyển trạng thái → Đề nghị thanh lý</button>'+
      '<button data-action="bulk-status" data-status="'+STATUS.BROKEN+'">→ Hỏng đề nghị sửa chữa</button>'+
      '<button data-action="bulk-status" data-status="'+STATUS.USE+'">→ Đang sử dụng</button>'+
      '<button data-action="export-liquidation">🖨️ Xuất biên bản đề nghị thanh lý</button>'+
      '<button data-action="clear-selection">Bỏ chọn</button>'+
    '</div>';
  }
  html += '<table><thead><tr>';
  if(canBulk) html+='<th style="width:30px"><input type="checkbox" id="selAll"></th>';
  cols.forEach(function(c){
    var arrow = col===c.k ? (dir===1?'▲':'▼') : '';
    html+='<th class="sortable" data-sort="'+c.k+'">'+c.label+' <span class="arrow">'+arrow+'</span></th>';
  });
  html+='</tr></thead><tbody>';
  if(!list.length){ html+='<tr><td colspan="'+(cols.length+1)+'"><div class="empty">Không có tài sản phù hợp bộ lọc</div></td></tr>'; }
  list.forEach(function(a){
    html+='<tr data-nav="asset_detail" data-nav-params=\'{"id":"'+a.id+'"}\' data-rowid="'+a.id+'">';
    if(canBulk) html+='<td data-stop="1"><input type="checkbox" class="rowchk" data-id="'+a.id+'" '+(state.selectedIds[a.id]?'checked':'')+'></td>';
    html+='<td><b>'+escapeHtml(a.code)+'</b></td><td>'+escapeHtml(a.name)+'</td><td>'+(a.type==="TSCD"?"TSCĐ":"CCDC")+'</td>'+
      '<td>'+escapeHtml(deptName(a.deptId))+'</td><td>'+fmtMoney(a.nguyenGia)+'</td><td>'+fmtMoney(a.giaTriConLai)+'</td>'+
      '<td><span class="badge '+(STATUS_BADGE[a.status]||'badge-gray')+'">'+a.status+'</span></td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

/* ========================= Import algorithm (XLSX, zero-dep) ========================= */
// --- Minimal ZIP central-directory reader using native DecompressionStream for inflate ---
function readUint16LE(b,o){ return b[o] | (b[o+1]<<8); }
function readUint32LE(b,o){ return (b[o] | (b[o+1]<<8) | (b[o+2]<<16) | (b[o+3]<<24))>>>0; }

async function inflateRawBytes(bytes){
  var ds = new DecompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function deflateRawBytes(bytes){
  var cs = new CompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(cs);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

async function readZipEntries(arrayBuffer){
  var bytes = new Uint8Array(arrayBuffer);
  // find End Of Central Directory
  var eocd=-1;
  for(var i=bytes.length-22; i>=0 && i>bytes.length-22-65557; i--){
    if(readUint32LE(bytes,i)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("Không tìm thấy EOCD trong file ZIP/XLSX (file có thể bị hỏng)");
  var cdOffset = readUint32LE(bytes, eocd+16);
  var cdCount = readUint16LE(bytes, eocd+10);
  var entries = {};
  var p = cdOffset;
  for(var e=0; e<cdCount; e++){
    if(readUint32LE(bytes,p)!==0x02014b50) break;
    var method = readUint16LE(bytes,p+10);
    var compSize = readUint32LE(bytes,p+20);
    var uncompSize = readUint32LE(bytes,p+24);
    var nameLen = readUint16LE(bytes,p+28);
    var extraLen = readUint16LE(bytes,p+30);
    var commentLen = readUint16LE(bytes,p+32);
    var localOffset = readUint32LE(bytes,p+42);
    var name = bytesToUtf8(bytes.subarray(p+46, p+46+nameLen));
    entries[name] = {method:method, compSize:compSize, uncompSize:uncompSize, localOffset:localOffset};
    p += 46 + nameLen + extraLen + commentLen;
  }
  var result = {};
  for(var name in entries){
    var ent = entries[name];
    var lp = ent.localOffset;
    if(readUint32LE(bytes,lp)!==0x04034b50) continue;
    var lNameLen = readUint16LE(bytes,lp+26);
    var lExtraLen = readUint16LE(bytes,lp+28);
    var dataStart = lp + 30 + lNameLen + lExtraLen;
    var raw = bytes.subarray(dataStart, dataStart+ent.compSize);
    if(ent.method===0){ result[name]=raw.slice(); }
    else if(ent.method===8){ result[name]=await inflateRawBytes(raw); }
    else { result[name]=raw.slice(); }
  }
  return result;
}
function bytesToUtf8(bytes){
  if(typeof TextDecoder!=="undefined") return new TextDecoder("utf-8").decode(bytes);
  var s=""; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return decodeURIComponent(escape(s));
}
function utf8ToBytes(str){
  if(typeof TextEncoder!=="undefined") return new TextEncoder().encode(str);
  var s=unescape(encodeURIComponent(str)), arr=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) arr[i]=s.charCodeAt(i); return arr;
}

function decodeXmlEntities(s){
  if(!s) return "";
  return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(m,h){return String.fromCodePoint(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(m,d){return String.fromCodePoint(parseInt(d,10));})
    .replace(/&amp;/g,"&");
}
function parseSharedStrings(xml){
  if(!xml) return [];
  var out=[]; var re=/<si\b[^>]*>([\s\S]*?)<\/si>/g, m;
  while((m=re.exec(xml))){
    var frag=m[1];
    var text="";
    var tre=/<t\b[^>]*>([\s\S]*?)<\/t>/g, tm;
    while((tm=tre.exec(frag))){ text+=decodeXmlEntities(tm[1]); }
    out.push(text);
  }
  return out;
}
var BUILTIN_DATE_FMT_IDS = {14:1,15:1,16:1,17:1,22:1};
function parseStyles(xml){
  if(!xml) return {cellXfs:[], customDateFmts:{}};
  var customDateFmts={};
  var nfRe=/<numFmt\b[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g, nm;
  while((nm=nfRe.exec(xml))){
    var code=decodeXmlEntities(nm[2]);
    if(/[ymdhs]/i.test(code) && !/general/i.test(code)) customDateFmts[nm[1]]=true;
  }
  var cellXfs=[];
  var xfsBlockM = xml.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/);
  if(xfsBlockM){
    var xfRe=/<xf\b([^>]*)\/?>/g, xm;
    while((xm=xfRe.exec(xfsBlockM[1]))){
      var attrs=xm[1]; var idM=attrs.match(/numFmtId="(\d+)"/);
      cellXfs.push(idM?idM[1]:"0");
    }
  }
  return {cellXfs:cellXfs, customDateFmts:customDateFmts};
}
function isDateFormat(numFmtId, styleInfo){
  if(BUILTIN_DATE_FMT_IDS[numFmtId]) return true;
  if(styleInfo.customDateFmts[String(numFmtId)]) return true;
  return false;
}
function excelSerialToISODate(serial){
  var utcDays = Math.floor(serial - 25569);
  var utcValue = utcDays*86400;
  var d = new Date(utcValue*1000);
  return d.toISOString().slice(0,10);
}
function colLettersToIndex(letters){
  var n=0; for(var i=0;i<letters.length;i++){ n=n*26 + (letters.charCodeAt(i)-64); } return n-1;
}
function parseWorksheetRows(xml, sharedStrings, styleInfo){
  var rows=[];
  var rowRe=/<row\b[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g, rm;
  var cellRe=/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g;
  while((rm=rowRe.exec(xml))){
    var rowIdx = parseInt(rm[1],10)-1;
    var rowXml = rm[2];
    var rowArr=[];
    cellRe.lastIndex=0;
    var cm;
    while((cm=cellRe.exec(rowXml))){
      var attrs = cm[1]!==undefined ? cm[1] : cm[2];
      var content = cm[1]!==undefined ? "" : cm[3];
      var rM = attrs.match(/r="([A-Z]+)\d+"/);
      if(!rM) continue;
      var colIdx = colLettersToIndex(rM[1]);
      var typeM = attrs.match(/t="([^"]+)"/);
      var cellType = typeM ? typeM[1] : null;
      var styleM = attrs.match(/s="(\d+)"/);
      var styleIdx = styleM ? parseInt(styleM[1],10) : 0;
      var val=null;
      if(cellType==="inlineStr"){
        var isM = content.match(/<t\b[^>]*>([\s\S]*?)<\/t>/);
        val = isM?decodeXmlEntities(isM[1]):"";
      } else if(cellType==="str"){
        var vM=content.match(/<v>([\s\S]*?)<\/v>/);
        val = vM?decodeXmlEntities(vM[1]):"";
      } else {
        var vM2=content.match(/<v>([\s\S]*?)<\/v>/);
        var raw = vM2?vM2[1]:null;
        if(raw===null){ val=null; }
        else if(cellType==="s"){ val = sharedStrings[parseInt(raw,10)] || ""; }
        else if(cellType==="b"){ val = raw==="1"; }
        else {
          var num = parseFloat(raw);
          var numFmtId = styleInfo.cellXfs[styleIdx] || "0";
          if(isDateFormat(numFmtId, styleInfo) && !isNaN(num)) val = excelSerialToISODate(num);
          else val = isNaN(num)?raw:num;
        }
      }
      rowArr[colIdx]=val;
    }
    rows[rowIdx]=rowArr;
  }
  var maxLen=rows.length;
  for(var i=0;i<maxLen;i++) if(!rows[i]) rows[i]=[];
  return rows;
}
function sheetFileList(zip){
  var wbXml = bytesToUtf8(zip["xl/workbook.xml"]||new Uint8Array());
  var relsXml = bytesToUtf8(zip["xl/_rels/workbook.xml.rels"]||new Uint8Array());
  var relMap={};
  var relRe=/<Relationship\b[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g, rm;
  while((rm=relRe.exec(relsXml))){ relMap[rm[1]] = "xl/"+rm[2].replace(/^\.?\/?/,""); }
  var sheets=[];
  var shRe=/<sheet\b[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g, sm;
  while((sm=shRe.exec(wbXml))){
    var name=decodeXmlEntities(sm[1]);
    var path = relMap[sm[2]] || ("xl/worksheets/sheet"+(sheets.length+1)+".xml");
    sheets.push({name:name, path:path});
  }
  if(!sheets.length){
    Object.keys(zip).forEach(function(k){ if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) sheets.push({name:k, path:k}); });
  }
  return sheets;
}
async function readAllXlsxSheets(arrayBuffer){
  var zip = await readZipEntries(arrayBuffer);
  var sharedStrings = parseSharedStrings(zip["xl/sharedStrings.xml"]?bytesToUtf8(zip["xl/sharedStrings.xml"]):"");
  var styleInfo = parseStyles(zip["xl/styles.xml"]?bytesToUtf8(zip["xl/styles.xml"]):"");
  var sheetDefs = sheetFileList(zip);
  var out=[];
  sheetDefs.forEach(function(sd){
    var xmlBytes = zip[sd.path];
    if(!xmlBytes) return;
    var rows = parseWorksheetRows(bytesToUtf8(xmlBytes), sharedStrings, styleInfo);
    out.push({name:sd.name, rows:rows});
  });
  return out;
}

/* --- Import business logic --- */
function looksLikeIndexColumn(rows, headerRowIdx, col){
  var vals=[];
  for(var i=headerRowIdx+1; i<rows.length && vals.length<6; i++){
    var v=rows[i]&&rows[i][col];
    if(v===undefined||v===null||v==="") continue;
    vals.push(v);
  }
  if(vals.length<3) return false;
  for(var k=0;k<vals.length;k++){
    if(typeof vals[k]!=="number" || vals[k]!==Math.floor(vals[k])) return false;
    if(k>0 && vals[k]!==vals[k-1]+1) return false;
  }
  return true;
}
function isDeptReferenceHeader(row){
  return row && typeof row[0]==="string" && normKey(row[0]).indexOf("phong ban")===0;
}
function parseDeptReferenceRows(rows){
  var map={};
  for(var i=0;i<rows.length;i++){
    var row=rows[i]; if(!row) continue;
    var rawKey=row[0], name=row[1];
    if(rawKey && name && typeof rawKey==="string" && !isDeptReferenceHeader(row)){
      map[rawKey.trim()] = String(name).trim();
    }
  }
  return map;
}
function isCategoryReferenceHeader(row){
  return row && typeof row[0]==="string" && /ma nhom/i.test(normKey(row[0]));
}
function parseCategoryReferenceRows(rows){
  var out=[];
  for(var i=0;i<rows.length;i++){
    var row=rows[i]; if(!row) continue;
    if(isCategoryReferenceHeader(row)) continue;
    var code=row[0], name=row[1];
    if(code && name) out.push({code:String(code).trim(), name:String(name).trim()});
  }
  return out;
}
function findHeaderCell(rows, maxScan){
  maxScan = maxScan || Math.min(rows.length, 15);
  for(var r=0;r<maxScan;r++){
    var row=rows[r]; if(!row) continue;
    for(var c=0;c<row.length;c++){
      var v=row[c];
      if(typeof v==="string"){
        var nk=normKey(v);
        if(nk.indexOf("ma ts")===0 || nk.indexOf("ma tscd")===0 || nk==="ma" || nk.indexOf("ma ccdc")===0 || nk.indexOf("ma cc")===0){
          if(!looksLikeIndexColumn(rows, r, c)) return {row:r, col:c, label:v};
        }
      }
    }
  }
  return null;
}
function classifySheet(rows){
  if(!rows || !rows.length) return {kind:"unknown"};
  for(var r=0;r<Math.min(rows.length,5);r++){
    if(isDeptReferenceHeader(rows[r])) return {kind:"dept_ref"};
    if(isCategoryReferenceHeader(rows[r])) return {kind:"cat_ref"};
  }
  var hc = findHeaderCell(rows);
  if(hc){
    var isTSCD = normKey(hc.label).indexOf("ts")>=0 && normKey(hc.label).indexOf("cc")<0;
    return {kind: isTSCD?"data_fa":"data_cc", header:hc};
  }
  return {kind:"unknown"};
}
function findColByKeywords(row, keywords){
  if(!row) return -1;
  for(var c=0;c<row.length;c++){
    if(typeof row[c]==="string"){
      var nk=normKey(row[c]);
      for(var k=0;k<keywords.length;k++) if(nk.indexOf(keywords[k])>=0) return c;
    }
  }
  return -1;
}
function normDeptKeyLoose(raw){
  // extract the LAST run of 5+ digits (branch/PGD numeric code), normalized to its last 6 digits,
  // so different compound-key formats sharing the same branch code resolve to the same lookup key.
  if(!raw) return "";
  var runs = String(raw).match(/\d{5,}/g);
  if(!runs || !runs.length) return "";
  var last = runs[runs.length-1];
  return last.length>6 ? last.slice(-6) : last;
}
function isValidDeptNameGuess(s){
  if(!s) return false;
  s=String(s).trim();
  if(s.length<2) return false;
  var nk=normKey(s);
  if(nk==="khong xac dinh") return false;
  return true;
}
function parseDepartmentField(raw, deptRefMap, deptRefLooseIndex){
  if(raw===undefined||raw===null) return {name:"(Không xác định)", rawKey:raw};
  var rawStr=String(raw).trim();
  if(deptRefMap && deptRefMap[rawStr]) return {name:deptRefMap[rawStr], rawKey:rawStr};
  var loose = normDeptKeyLoose(rawStr);
  if(deptRefLooseIndex && loose && deptRefLooseIndex[loose]) return {name:deptRefLooseIndex[loose], rawKey:rawStr};
  // heuristic: compound key "org.midSegment.lastSegment" where either the mid segment (after its
  // own "-") or the last segment (after " - ") may hold a human-readable department/branch name.
  var parts = rawStr.split(".");
  if(parts.length>=3){
    var mid = parts[1];
    var midDash = mid.indexOf("-");
    var cand1 = midDash>=0 ? mid.slice(midDash+1).trim() : "";
    var last = parts.slice(2).join(".");
    // only strip a leading "<digits> - " branch-code prefix, not every " - " in the text
    // (a clean branch name like "CN Bến Lức - PGD Thủ Thừa" also contains " - ")
    var codePrefixM = /^\d+\s*-\s*/.exec(last);
    var cand2 = codePrefixM ? last.slice(codePrefixM[0].length).trim() : last.trim();
    if(isValidDeptNameGuess(cand1)) return {name:cand1, rawKey:rawStr};
    if(isValidDeptNameGuess(cand2)) return {name:cand2, rawKey:rawStr};
  } else if(parts.length===2){
    var mid2 = parts[1];
    var dashIdx = mid2.indexOf("-");
    if(dashIdx>=0){
      var nameGuess = mid2.slice(dashIdx+1).trim();
      if(isValidDeptNameGuess(nameGuess)) return {name:nameGuess, rawKey:rawStr};
    }
  }
  if(loose) return {name:"Chi nhánh/PGD ("+loose+")", rawKey:rawStr};
  return {name: rawStr || "(Không xác định)", rawKey:rawStr};
}
function isLegendRow(row){
  if(!row) return false;
  var defined=0, matches=0;
  for(var c=0;c<row.length;c++){
    if(row[c]===null||row[c]===undefined||row[c]==="") continue;
    defined++;
    if(row[c]===c+1) matches++;
  }
  return defined>=3 && matches>=Math.min(5,defined) && (matches/defined)>0.8;
}
function categoryLevelOf(code){
  var s=String(code||"").trim();
  var m=s.match(/^(\d+)/);
  if(!m) return 0;
  return Math.ceil(m[1].length/2);
}
function extractAssetRows(rows, deptRefMap, catRefList, typeHint){
  var hc = findHeaderCell(rows);
  if(!hc) return [];
  var headerRow = rows[hc.row];
  var colCode = hc.col;
  var colName = findColByKeywords(headerRow, ["ten"]);
  if(colName<0) colName = colCode+1;
  var colDept = findColByKeywords(headerRow, ["phong ban","don vi","chi nhanh"]);
  var colNguyenGia = findColByKeywords(headerRow, ["nguyen gia"]);
  var colConLai = findColByKeywords(headerRow, ["gia tri con lai","con lai"]);
  var colDate = findColByKeywords(headerRow, ["ngay ghi nhan","ngay"]);
  var colCat = findColByKeywords(headerRow, ["nhom","ma nhom","loai"]);

  var deptRefLooseIndex={};
  if(deptRefMap) Object.keys(deptRefMap).forEach(function(k){ var l=normDeptKeyLoose(k); if(l) deptRefLooseIndex[l]=deptRefMap[k]; });

  var out=[];
  var lastCategoryLabel=null;
  for(var i=hc.row+1;i<rows.length;i++){
    var row=rows[i]; if(!row || !row.length) continue;
    if(isLegendRow(row)) continue;
    var codeVal = row[colCode];
    var nameVal = colName>=0 ? row[colName] : undefined;
    var codeLooksLikeGroupLabel = typeof codeVal==="string" && /^\d+(\.\d+)*\./.test(codeVal.trim()) && (nameVal===undefined||nameVal===null||String(nameVal).trim()==="");
    if(codeVal===undefined||codeVal===null||String(codeVal).trim()===""||codeLooksLikeGroupLabel){
      // group/subtotal row carrying a category label (either in the code column itself, or colCat)
      var maybeCat = codeLooksLikeGroupLabel ? codeVal : row[colCat>=0?colCat:0];
      if(typeof maybeCat==="string" && /^\d+(\.\d+)*\./.test(maybeCat.trim())){
        lastCategoryLabel = maybeCat.trim();
      }
      continue;
    }
    var deptInfo = colDept>=0 ? parseDepartmentField(row[colDept], deptRefMap, deptRefLooseIndex) : {name:"(Không xác định)"};
    var catInfo = null;
    if(colCat>=0 && typeof row[colCat]==="string" && row[colCat].trim()){
      var raw = row[colCat].trim();
      var codeM = raw.match(/^([A-Za-z0-9.]+)\s*-?\s*(.*)$/);
      catInfo = {code: codeM?codeM[1]:raw, name: codeM&&codeM[2]?codeM[2]:raw};
    } else if(lastCategoryLabel){
      var dotIdx=lastCategoryLabel.indexOf(".");
      catInfo = {code: dotIdx>0?lastCategoryLabel.slice(0,dotIdx):lastCategoryLabel, name: dotIdx>0?lastCategoryLabel.slice(dotIdx+1):lastCategoryLabel};
    }
    out.push({
      code: String(codeVal).trim(),
      name: colName>=0 ? String(row[colName]||"").trim() : "",
      type: typeHint,
      dept: deptInfo,
      category: catInfo,
      nguyenGia: colNguyenGia>=0 ? Number(row[colNguyenGia])||0 : 0,
      giaTriConLai: colConLai>=0 ? Number(row[colConLai])||0 : 0,
      ngayGhiNhan: colDate>=0 ? row[colDate] : null
    });
  }
  return out;
}

async function runBankImport(arrayBuffer){
  var sheets = await readAllXlsxSheets(arrayBuffer);
  var deptRefMap=null, catRefList=null;
  var dataSheets=[];
  sheets.forEach(function(sh){
    var cls = classifySheet(sh.rows);
    if(cls.kind==="dept_ref") deptRefMap = Object.assign(deptRefMap||{}, parseDeptReferenceRows(sh.rows));
    else if(cls.kind==="cat_ref") catRefList = (catRefList||[]).concat(parseCategoryReferenceRows(sh.rows));
    else if(cls.kind==="data_fa" || cls.kind==="data_cc") dataSheets.push({sheet:sh, kind:cls.kind});
  });
  var allRows=[];
  dataSheets.forEach(function(d){
    var typeHint = d.kind==="data_fa"?"TSCD":"CCDC";
    var rows = extractAssetRows(d.sheet.rows, deptRefMap, catRefList, typeHint);
    rows.forEach(function(r){ r.sourceSheet=d.sheet.name; });
    allRows = allRows.concat(rows);
  });
  return {rows:allRows, deptRefCount: deptRefMap?Object.keys(deptRefMap).length:0, catRefCount: catRefList?catRefList.length:0, sheetSummary: dataSheets.map(function(d){return d.sheet.name+": "+extractAssetRows(d.sheet.rows, deptRefMap, catRefList, d.kind==="data_fa"?"TSCD":"CCDC").length+" dòng";})};
}

      var ck=normKey(r.category.code);

      else{
        var nc={id:uid("C"), code:r.category.code.toUpperCase(), name:r.category.name||r.category.code, type:r.type};

      }

      existing.nguyenGia=r.nguyenGia||existing.nguyenGia; existing.giaTriConLai=r.giaTriConLai||existing.giaTriConLai;
      updated++;
    } else {
      DB.assets.push({
        id:r.code, code:r.code, name:r.name||"(Chưa đặt tên)", type:r.type, catId:catId, deptId:deptId, userId:null,
        nguyenGia:r.nguyenGia||0, giaTriConLai:r.giaTriConLai||0, ngayGhiNhan: r.ngayGhiNhan||todayStr(), status:STATUS.USE,
        history:[{status:STATUS.USE, date:todayStr(), note:"Import từ file Excel", by: currentUser()?currentUser().username:"system"}]
      });
      added++;
    }
  });
  saveDB();
  return {added:added, updated:updated};
}

/* ========================= ZIP writer (STORED) + DOCX mail-merge ========================= */
var CRC_TABLE = (function(){
  var t=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++){ c = (c&1)?(0xEDB88320 ^ (c>>>1)):(c>>>1); } t[n]=c>>>0; } return t;
})();
function crc32(bytes){
  var c=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function writeUint32LE(arr, v){ arr.push(v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF); }
function writeUint16LE(arr, v){ arr.push(v&0xFF,(v>>>8)&0xFF); }
function buildZipStored(entries){
  // entries: [{name, bytes}]
  var localChunks=[], central=[], offset=0;
  entries.forEach(function(ent){
    var nameBytes = utf8ToBytes(ent.name);
    var crc = crc32(ent.bytes);
    var lh=[]; writeUint32LE(lh,0x04034b50); writeUint16LE(lh,20); writeUint16LE(lh,0); writeUint16LE(lh,0);
    writeUint16LE(lh,0); writeUint16LE(lh,0); writeUint32LE(lh,crc); writeUint32LE(lh,ent.bytes.length); writeUint32LE(lh,ent.bytes.length);
    writeUint16LE(lh,nameBytes.length); writeUint16LE(lh,0);
    var localHeader = new Uint8Array(lh.concat(Array.from(nameBytes)));
    var entryOffset = offset;
    localChunks.push(localHeader, ent.bytes);
    offset += localHeader.length + ent.bytes.length;

    var ch=[]; writeUint32LE(ch,0x02014b50); writeUint16LE(ch,20); writeUint16LE(ch,20); writeUint16LE(ch,0);
    writeUint16LE(ch,0); writeUint16LE(ch,0); writeUint16LE(ch,0); writeUint32LE(ch,crc);
    writeUint32LE(ch,ent.bytes.length); writeUint32LE(ch,ent.bytes.length);
    writeUint16LE(ch,nameBytes.length); writeUint16LE(ch,0); writeUint16LE(ch,0); writeUint16LE(ch,0); writeUint16LE(ch,0);
    writeUint32LE(ch,0); writeUint32LE(ch,entryOffset);
    central.push(new Uint8Array(ch.concat(Array.from(nameBytes))));
  });
  var cdStart=offset, cdSize=0;
  central.forEach(function(c){ cdSize+=c.length; });
  var eocd=[]; writeUint32LE(eocd,0x06054b50); writeUint16LE(eocd,0); writeUint16LE(eocd,0);
  writeUint16LE(eocd,entries.length); writeUint16LE(eocd,entries.length);
  writeUint32LE(eocd,cdSize); writeUint32LE(eocd,cdStart); writeUint16LE(eocd,0);
  var all = localChunks.concat(central, [new Uint8Array(eocd)]);
  var total=0; all.forEach(function(a){total+=a.length;});
  var out=new Uint8Array(total), p=0;
  all.forEach(function(a){ out.set(a,p); p+=a.length; });
  return out;
}
function flattenRuns(fragment){
  var text=""; var tre=/<w:t\b[^>]*>([\s\S]*?)<\/w:t>/g, tm;
  while((tm=tre.exec(fragment))) text+=decodeXmlEntities(tm[1]);
  return text;
}
function escapeXml(s){ return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function replaceScalarsInXml(xml, dict){
  var paraRe=/<w:p\b[^>]*\/>|<w:p\b[^>]*>[\s\S]*?<\/w:p>/g;
  return xml.replace(paraRe, function(para){
    var flat = flattenRuns(para);
    var hasPlaceholder=false;
    Object.keys(dict).forEach(function(k){ if(flat.indexOf("{{"+k+"}}")>=0) hasPlaceholder=true; });
    if(!hasPlaceholder) return para;
    // collapse all runs' text into first run, clear rest, then substitute
    var firstRPr=null;
    var runRe=/<w:r\b[^>]*>[\s\S]*?<\/w:r>|<w:r\b[^>]*\/>/g;
    var merged="";
    var newPara = para.replace(runRe, function(run){
      var rprM = run.match(/<w:rPr\b[^>]*>[\s\S]*?<\/w:rPr>/);
      if(rprM && !firstRPr) firstRPr=rprM[0];
      var t = flattenRuns(run);
      merged += t;
      return "";
    });
    Object.keys(dict).forEach(function(k){
      merged = merged.split("{{"+k+"}}").join(escapeXml(dict[k]));
    });
    var openTagM = para.match(/^<w:p\b[^>]*>/);
    var openTag = openTagM?openTagM[0]:"<w:p>";
    var runXml = "<w:r>"+(firstRPr||"")+"<w:t xml:space=\"preserve\">"+merged+"</w:t></w:r>";
    return openTag + runXml + "</w:p>";
  });
}
function repeatTableRows(xml, rowsData, keys){
  var rowRe=/<w:tr\b[^>]*>[\s\S]*?<\/w:tr>/g;
  return xml.replace(rowRe, function(trXml){
    var flat=flattenRuns(trXml);
    var isTemplateRow = keys.some(function(k){ return flat.indexOf("{{"+k+"}}")>=0; });
    if(!isTemplateRow) return trXml;
    return rowsData.map(function(rowDict){
      return replaceScalarsInXml(trXml, rowDict);
    }).join("");
  });
}
async function mergeDocxTemplate(templateBytes, scalarDict, rowDicts, rowKeys){
  var zip = await readZipEntries(templateBytes.buffer ? templateBytes.buffer : templateBytes);
  var docXmlBytes = zip["word/document.xml"];
  if(!docXmlBytes) throw new Error("File mẫu không hợp lệ (thiếu word/document.xml)");
  var xml = bytesToUtf8(docXmlBytes);
  if(rowDicts && rowDicts.length) xml = repeatTableRows(xml, rowDicts, rowKeys||Object.keys(rowDicts[0]||{}));
  xml = replaceScalarsInXml(xml, scalarDict);
  var newEntries=[];
  Object.keys(zip).forEach(function(name){
    var bytes = name==="word/document.xml" ? utf8ToBytes(xml) : zip[name];
    newEntries.push({name:name, bytes:bytes});
  });
  return buildZipStored(newEntries);
}

async function doExportDocx(templateKey, scalarDict, rowDicts, rowKeys, filename, fallbackHtml, fallbackTitle){
  var tpl = DB.templateConfig.files[templateKey];
  if(tpl){
    try{
      var bytes = base64ToUint8Array(tpl.base64);
      var outBytes = await mergeDocxTemplate(bytes, scalarDict, rowDicts, rowKeys);
      downloadBlob(new Blob([outBytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}), filename);
      return;
    }catch(e){ console.error(e); flash("Không dùng được mẫu đã tải lên ("+e.message+"), chuyển sang in HTML.", "err"); }
  }
  openPrintWindow(fallbackTitle, fallbackHtml);
}

    b.addEventListener("click", async function(){
      if(!confirm("Bạn có chắc chắn muốn xuất phiếu báo hỏng?")) return;
      var r=DB.repairs.filter(function(x){return x.id===this.getAttribute("data-id");}.bind(this))[0];
      var a=byId(r.assetId);
      var fallback=reportLetterheadHtml("PHIẾU BÁO HỎNG / SỰ CỐ")+'<table><tr><th>Mã tài sản</th><td>'+escapeHtml(a?a.code:"")+'</td></tr>'+
        '<tr><th>Tên tài sản</th><td>'+escapeHtml(a?a.name:"")+'</td></tr><tr><th>Phòng ban</th><td>'+escapeHtml(deptName(r.deptId))+'</td></tr>'+
        '<tr><th>Mô tả sự cố</th><td>'+escapeHtml(r.note||"")+'</td></tr></table>'+reportSignatureHtml();
      await doExportDocx("repair", {MA_PHIEU:r.id, MA_TS:a?a.code:"", TEN_TS:a?a.name:"", PHONG_BAN:deptName(r.deptId), MO_TA:r.note||"", NGAY:fmtDate(todayStr())}, null, null,
        "PhieuBaoHong_"+r.id+".docx", fallback, "Phiếu báo hỏng "+r.id);
    });
  });

  // Inventory
  var invForm = qs("[data-form='inventory-new']", root);
  if(invForm) invForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var fd=new FormData(this); var data={}; fd.forEach(function(v,k){data[k]=v;});
    var scope = data.deptId==="ALL" ? "ALL" : "DEPT";
    var assetIds = (scope==="ALL" ? DB.assets : DB.assets.filter(function(a){return a.deptId===data.deptId;})).map(function(a){return a.id;});
    var iv={id:uid("KK"), scope:scope, deptId: scope==="ALL"?null:data.deptId, date:data.date, assetIds:assetIds};
    DB.inventories.push(iv); saveDB(); flash("Đã lập biên bản kiểm kê ("+assetIds.length+" tài sản).");
  });
  qsa("[data-action='print-inventory']", root).forEach(function(b){
    b.addEventListener("click", async function(){
      if(!confirm("Bạn có chắc chắn muốn xuất biên bản kiểm kê?")) return;
      var iv=DB.inventories.filter(function(x){return x.id===this.getAttribute("data-id");}.bind(this))[0];
      var list = iv.assetIds.map(byId).filter(Boolean);
      var rowDicts = list.map(assetRowDict);
      var tableRows = list.map(function(a,i){ return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(a.code)+'</td><td>'+escapeHtml(a.name)+'</td><td>'+escapeHtml(a.status)+'</td></tr>'; }).join("");
      var fallback=reportLetterheadHtml("BIÊN BẢN KIỂM KÊ TÀI SẢN")+'<p>Phạm vi: '+(iv.scope==="ALL"?"Toàn chi nhánh":escapeHtml(deptName(iv.deptId)))+' — Ngày: '+fmtDate(iv.date)+'</p>'+
        '<table><tr><th>STT</th><th>Mã</th><th>Tên tài sản</th><th>Trạng thái</th></tr>'+tableRows+'</table>'+reportSignatureHtml();
      await doExportDocx("inventory", {NGAY:fmtDate(iv.date), PHAM_VI: iv.scope==="ALL"?"Toàn chi nhánh":deptName(iv.deptId), SO_LUONG:String(list.length)}, rowDicts,
        ["STT","MA","TEN","NHOM","PHONG_BAN","NGUYEN_GIA","GIA_TRI_CON_LAI","TRANG_THAI"], "BienBanKiemKe_"+iv.id+".docx", fallback, "Biên bản kiểm kê "+iv.id);
    });
  });

  // Categories drill-down
  qsa("[data-dblclick='cat-drill']", root).forEach(function(tr){
    tr.addEventListener("dblclick", function(){ nav("assets",{catId:this.getAttribute("data-id")}); });
  });

  // Admin users
  var showUserNewBtn=qs("[data-action='show-user-new']",root); if(showUserNewBtn) showUserNewBtn.addEventListener("click", function(){ state.showUserNew=true; render(); });
  var hideUserNewBtn=qs("[data-action='hide-user-new']",root); if(hideUserNewBtn) hideUserNewBtn.addEventListener("click", function(){ state.showUserNew=false; render(); });
  var userNewForm2 = qs("[data-form='user-new']", root);
  if(userNewForm2) userNewForm2.addEventListener("submit", function(ev){
    ev.preventDefault();
    var fd=new FormData(this); var data={}; fd.forEach(function(v,k){data[k]=v;});
    if(DB.users.filter(function(x){return x.username===data.username;}).length){ flash("Tài khoản đã tồn tại!","err"); return; }
    DB.users.push({id:uid("U"), username:data.username, password:data.password, name:data.name, empCode:data.empCode, deptId:data.deptId, role:data.role});
    saveDB(); state.showUserNew=false; flash("Đã thêm người dùng.");
  });
  qsa("[data-action='edit-user']", root).forEach(function(b){ b.addEventListener("click", function(){ nav("admin_users",{editId:this.getAttribute("data-id")}); }); });
  var userEditForm = qs("[data-form='user-edit']", root);
  if(userEditForm) userEditForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var id=this.getAttribute("data-id"); var fd=new FormData(this); var data={}; fd.forEach(function(v,k){data[k]=v;});
    var x=userById(id); Object.assign(x, {empCode:data.empCode, name:data.name, deptId:data.deptId, role:data.role});
    saveDB(); flash("Đã lưu thay đổi người dùng."); nav("admin_users",{},{replace:true});
  });
  var backUsersBtn = qs("[data-action='goback-users']", root); if(backUsersBtn) backUsersBtn.addEventListener("click", function(){ nav("admin_users",{},{replace:true}); });
  qsa("[data-action='delete-user']", root).forEach(function(b){
    b.addEventListener("click", function(){
      var id=this.getAttribute("data-id");
      if(id===currentUser().id){ flash("Không thể tự xóa tài khoản đang đăng nhập.","err"); return; }
      var admins = DB.users.filter(function(x){return x.role==="admin";});
      var target=userById(id);
      if(target.role==="admin" && admins.length<=1){ flash("Không thể xóa Admin cuối cùng.","err"); return; }
      if(!confirm("Xóa người dùng "+target.name+"?")) return;
      DB.users = DB.users.filter(function(x){return x.id!==id;});
      saveDB(); flash("Đã xóa người dùng.");
    });
  });
  qsa("[data-action='reset-pw']", root).forEach(function(b){
    b.addEventListener("click", function(){
      var x=userById(this.getAttribute("data-id"));
      var np=prompt("Nhập mật khẩu mới cho "+x.name+":","123456");
      if(np){ x.password=np; saveDB(); flash("Đã đặt lại mật khẩu."); }
    });
  });

  // Admin departments
  var deptForm = qs("[data-form='dept-new']", root);
  if(deptForm) deptForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var fd=new FormData(this); var data={}; fd.forEach(function(v,k){data[k]=v;});
    DB.departments.push({id:uid("D"), code:data.code, name:data.name, address:data.address});
    saveDB(); flash("Đã thêm phòng ban.");
  });
  qsa("[data-action='delete-dept']", root).forEach(function(b){
    b.addEventListener("click", function(){
      var id=this.getAttribute("data-id");
      var used = DB.assets.some(function(a){return a.deptId===id;}) || DB.users.some(function(x){return x.deptId===id;});
      if(used){ flash("Không thể xóa: vẫn còn tài sản hoặc người dùng thuộc phòng ban này.","err"); return; }
      if(!confirm("Xóa phòng ban này?")) return;
      DB.departments = DB.departments.filter(function(d){return d.id!==id;});
      saveDB(); flash("Đã xóa phòng ban.");
    });
  });

  // Admin categories
  var catForm = qs("[data-form='cat-new']", root);
  if(catForm) catForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var fd=new FormData(this); var data={}; fd.forEach(function(v,k){data[k]=v;});
    var code=data.code.toUpperCase();
    if(DB.categories.some(function(c){return c.code===code;})){ flash("Mã nhóm đã tồn tại!","err"); return; }
    DB.categories.push({id:uid("C"), code:code, name:data.name, type:data.type});
    saveDB(); flash("Đã thêm nhóm tài sản.");
  });

  // Import
  var importFile = qs("#importFile", root);
  if(importFile) importFile.addEventListener("change", async function(){
    var file=this.files[0]; if(!file) return;
    qs("#importPreview",root).innerHTML='<div class="card">⏳ Đang đọc file...</div>';
    try{
      var buf = await file.arrayBuffer();
      var result = await runBankImport(buf);
      state._importRows = result.rows;
      var html='<div class="card"><h3>Xem trước kết quả import</h3>'+
        '<p>Đã đọc '+result.rows.length+' dòng tài sản từ '+result.sheetSummary.length+' sheet dữ liệu.</p>'+
        '<ul>'+result.sheetSummary.map(function(s){return '<li>'+escapeHtml(s)+'</li>';}).join("")+'</ul>'+
        '<p>Tham chiếu phòng ban: '+result.deptRefCount+' mục. Tham chiếu nhóm: '+result.catRefCount+' mục.</p>'+
        '<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Loại</th><th>Phòng ban</th><th>Nhóm</th></tr></thead><tbody>'+
        result.rows.slice(0,15).map(function(r){ return '<tr><td>'+escapeHtml(r.code)+'</td><td>'+escapeHtml(r.name)+'</td><td>'+r.type+'</td>'+
          '<td>'+escapeHtml(r.dept?r.dept.name:"")+'</td><td>'+escapeHtml(r.category?r.category.name:"")+'</td></tr>'; }).join("")+
        '</tbody></table></div>'+
        '<div class="form-actions"><button class="btn btn-blue" data-action="commit-import">✔ Xác nhận import '+result.rows.length+' dòng</button></div></div>';
      qs("#importPreview",root).innerHTML=html;
      qs("[data-action='commit-import']",root).addEventListener("click", function(){
        if(!confirm("Xác nhận import "+state._importRows.length+" dòng tài sản vào hệ thống?")) return;
        var r=commitImportRows(state._importRows);
        flash("Import hoàn tất: thêm mới "+r.added+", cập nhật "+r.updated+".");
        nav("assets",{},{replace:true});
      });
    }catch(e){
      console.error(e);
      qs("#importPreview",root).innerHTML='<div class="card login-error">Lỗi đọc file: '+escapeHtml(e.message)+'</div>';
    }
  });

  // Templates
  qsa("[data-template-upload]", root).forEach(function(inp){
    inp.addEventListener("change", async function(){
      var k=this.getAttribute("data-template-upload"); var file=this.files[0]; if(!file) return;
      var buf=await file.arrayBuffer();
      DB.templateConfig.files[k]={filename:file.name, base64:arrayBufferToBase64(buf)};
      saveDB(); flash("Đã tải lên mẫu: "+file.name); render();
    });
  });
  qsa("[data-action='remove-template']", root).forEach(function(b){
    b.addEventListener("click", function(){
      delete DB.templateConfig.files[this.getAttribute("data-k")]; saveDB(); flash("Đã xóa mẫu."); render();
    });
  });

  // Settings / backup
  var backupBtn = qs("[data-action='backup-export']", root);
  if(backupBtn) backupBtn.addEventListener("click", function(){
    downloadBlob(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), "VTB-ASSETS-backup-"+todayStr()+".json");
  });
  var restoreFile = qs("#restoreFile", root);
  if(restoreFile) restoreFile.addEventListener("change", async function(){
    var file=this.files[0]; if(!file) return;
    if(!confirm("Phục hồi sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?")) return;
    try{
      var text=await file.text(); var data=JSON.parse(text);
      DB=data; migrateDB(); saveDB(); flash("Đã phục hồi dữ liệu."); render();
    }catch(e){ flash("File sao lưu không hợp lệ.","err"); }
  });
  var cadenceForm = qs("[data-form='cadence']", root);
  if(cadenceForm) cadenceForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    DB.inventoryCadenceMonths = Number(new FormData(this).get("months"))||6;
    saveDB(); flash("Đã lưu cấu hình.");
  });

  // Hard reset
  var hrForm = qs("[data-form='hard-reset']", root);
  if(hrForm) hrForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var txt = new FormData(this).get("confirmText")||"";
    if(normKey(txt) !== normKey("XÁC NHẬN")){ flash("Vui lòng nhập đúng cụm xác nhận.","err"); return; }
    if(!confirm("XÁC NHẬN LẦN CUỐI: Xóa toàn bộ dữ liệu?")) return;
    hardReset(); flash("Đã khôi phục dữ liệu mẫu ban đầu."); nav("dashboard",{},{replace:true});
  });
}

/* ========================= Boot ========================= */
loadDB();
if(typeof module!=="undefined" && module.exports){
  module.exports = { DB:function(){return DB;}, state:state, nav:nav, render:render, loadDB:loadDB, hardReset:hardReset,
    readZipEntries:readZipEntries, readAllXlsxSheets:readAllXlsxSheets, runBankImport:runBankImport, commitImportRows:commitImportRows,
    mergeDocxTemplate:mergeDocxTemplate, buildZipStored:buildZipStored, classifySheet:classifySheet, extractAssetRows:extractAssetRows,
    parseDeptReferenceRows:parseDeptReferenceRows, parseCategoryReferenceRows:parseCategoryReferenceRows, parseDepartmentField:parseDepartmentField,
    seedData:seedData, scopedAssets:scopedAssets, currentUser:currentUser, STATUS:STATUS };
} else {
  render();
}
})();
</script>
</body>
</html>
